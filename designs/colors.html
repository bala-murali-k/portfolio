<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 color · random generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #e0e4e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            width: min(100%, 700px);
            padding: 2.5rem 2rem;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            border-left: 7px solid #3b82f6;
            padding-left: 1.3rem;
        }

        h1 span {
            background: #1e293b;
            color: white;
            font-size: 1rem;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        /* live color area */
        .color-stage {
            background: #ffffff;
            border-radius: 2.2rem;
            padding: 2rem;
            box-shadow: 0 12px 25px -8px rgba(0, 0, 0, 0.2), 0 4px 8px rgba(0, 0, 0, 0.02);
            margin-bottom: 2rem;
        }

        .color-preview {
            width: 100%;
            height: 220px;
            border-radius: 1.8rem;
            background-color: #2d3748;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.5);
            transition: background-color 0.15s ease;
            border: 3px solid rgba(255,255,255,0.8);
            margin-bottom: 1.8rem;
        }

        .color-codes {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .code-pill {
            background: #f8fafc;
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-size: 1.3rem;
            font-weight: 550;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05), inset 0 1px 3px white;
            border: 1px solid #dde2e8;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .code-label {
            font-size: 0.85rem;
            font-weight: 500;
            background: #d1d9e6;
            color: #1e2b3a;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .rgb-value, .hex-value {
            color: #0f172a;
        }

        /* buttons */
        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .btn {
            border: none;
            background: white;
            padding: 1rem 2rem;
            border-radius: 200px;
            font-size: 1.2rem;
            font-weight: 550;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            box-shadow: 0 5px 15px rgba(0, 27, 55, 0.1);
            transition: 0.15s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.6);
            flex: 1 1 auto;
            min-width: 180px;
            color: #1e293b;
        }

        .btn-primary {
            background: #1e293b;
            color: white;
            box-shadow: 0 8px 18px #1e293b40;
            border: 1px solid #475569;
        }

        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
            box-shadow: 0 4px 10px #1e293b70;
        }

        .btn-secondary {
            background: #e9edf2;
            border: 1px solid #b9c7da;
        }

        .btn-secondary:hover {
            background: #dde3ea;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .copied-toast {
            text-align: center;
            font-size: 0.95rem;
            margin-top: 1.2rem;
            color: #0b3b2c;
            background: #c8f0e1;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: auto;
            backdrop-filter: blur(4px);
            font-weight: 500;
            transition: opacity 0.2s;
            border: 1px solid #a3e0ca;
        }

        .history-area {
            margin-top: 2rem;
            border-top: 2px dashed #bac8d9;
            padding-top: 1.5rem;
        }

        .history-title {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .history-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            min-height: 50px;
        }

        .history-item {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: 0.1s;
            cursor: pointer;
        }

        .history-item:hover {
            transform: scale(1.15) rotate(2deg);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        .empty-history {
            color: #8f9eb2;
            font-style: italic;
            padding: 0.4rem 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            ⚡ color generator
            <span>v2</span>
        </h1>

        <!-- main preview panel -->
        <div class="color-stage">
            <div class="color-preview" id="colorPreview"></div>

            <div class="color-codes" id="colorCodes">
                <!-- filled by javascript -->
                <div class="code-pill"><span class="code-label">HEX</span> <span class="hex-value" id="hexDisplay">#2d3748</span></div>
                <div class="code-pill"><span class="code-label">RGB</span> <span class="rgb-value" id="rgbDisplay">45, 55, 72</span></div>
            </div>
        </div>

        <!-- action row -->
        <div class="action-grid">
            <button class="btn btn-primary" id="randomizeBtn">
                <span>🎲</span> random color
            </button>
            <button class="btn btn-secondary" id="copyHexBtn">
                <span>📋</span> copy HEX
            </button>
            <button class="btn btn-secondary" id="copyRgbBtn">
                <span>📋</span> copy RGB
            </button>
        </div>

        <!-- subtle feedback message -->
        <div id="copyMessage" style="text-align: center; min-height: 2rem;"></div>

        <!-- history section -->
        <div class="history-area">
            <div class="history-title">
                <span>📜 recent colors</span>
                <button id="clearHistoryBtn" style="background: none; border: none; color: #6b7f98; cursor: pointer; font-size: 0.9rem; text-decoration: underline dotted;">clear</button>
            </div>
            <div class="history-swatches" id="historyContainer">
                <!-- history items inserted dynamically -->
                <div class="empty-history">click random to start</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const previewDiv = document.getElementById('colorPreview');
            const hexSpan = document.getElementById('hexDisplay');
            const rgbSpan = document.getElementById('rgbDisplay');
            const randomizeBtn = document.getElementById('randomizeBtn');
            const copyHexBtn = document.getElementById('copyHexBtn');
            const copyRgbBtn = document.getElementById('copyRgbBtn');
            const copyMessageDiv = document.getElementById('copyMessage');
            const historyContainer = document.getElementById('historyContainer');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            // --- state ---
            // history queue (max 12 items)
            let colorHistory = [];

            // current color (initial: a pleasant slate)
            let currentColor = {
                hex: '#2d3748',
                r: 45,
                g: 55,
                b: 72
            };

            // --- helper: generate random 0-255 integer
            function randomByte() {
                return Math.floor(Math.random() * 256);
            }

            // --- convert (r,g,b) to hex string (with #)
            function rgbToHex(r, g, b) {
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            }

            // --- generate random color object
            function generateRandomColor() {
                const r = randomByte();
                const g = randomByte();
                const b = randomByte();
                return {
                    r, g, b,
                    hex: rgbToHex(r, g, b)
                };
            }

            // --- update UI with given color object + manage history
            function setColor(color, addToHistory = true) {
                // update current
                currentColor = { ...color };

                // preview background
                previewDiv.style.backgroundColor = currentColor.hex;

                // text displays
                hexSpan.textContent = currentColor.hex;
                rgbSpan.textContent = `${currentColor.r}, ${currentColor.g}, ${currentColor.b}`;

                // optionally add to history (avoid duplicates if same color consecutively)
                if (addToHistory) {
                    // avoid adding if identical to last history item (optional, but nice)
                    if (colorHistory.length === 0 || colorHistory[0].hex !== currentColor.hex) {
                        colorHistory.unshift({ ...currentColor });   // store a copy

                        // limit to 12 items
                        if (colorHistory.length > 12) colorHistory.pop();

                        // refresh history swatches
                        renderHistory();
                    }
                }

                // clear any old copy message when color changes
                copyMessageDiv.innerHTML = '';
            }

            // --- render history swatches
            function renderHistory() {
                if (colorHistory.length === 0) {
                    historyContainer.innerHTML = '<div class="empty-history">click random to start</div>';
                    return;
                }

                let html = '';
                colorHistory.forEach((col, index) => {
                    // use hex directly, but background style
                    html += `<div class="history-item" style="background-color: ${col.hex};" title="${col.hex} (click to load)" data-history-index="${index}"></div>`;
                });
                historyContainer.innerHTML = html;

                // attach click listeners to each history swatch (event delegation also works, but we can attach now)
                document.querySelectorAll('.history-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const index = e.currentTarget.dataset.historyIndex;
                        if (index !== undefined && colorHistory[index]) {
                            // load that color without adding again (addToHistory = false)
                            setColor(colorHistory[index], false);
                        }
                    });
                });
            }

            // --- clear history
            function clearHistory() {
                colorHistory = [];
                renderHistory();
                // don't change current color
            }

            // --- copy to clipboard with message
            async function copyText(text, label) {
                try {
                    await navigator.clipboard.writeText(text);
                    copyMessageDiv.innerHTML = `<div class="copied-toast">✅ ${label} copied · ${text}</div>`;
                } catch (err) {
                    copyMessageDiv.innerHTML = `<div class="copied-toast" style="background:#ffe5d9;color:#8a3c1a;">⚠️ copy failed · ${text}</div>`;
                }
                // remove message after 2 sec
                setTimeout(() => {
                    if (copyMessageDiv.innerHTML.includes('copied') || copyMessageDiv.innerHTML.includes('failed')) {
                        copyMessageDiv.innerHTML = '';
                    }
                }, 2000);
            }

            // --- initial setup
            function init() {
                // set initial preview & codes
                setColor(currentColor, false);   // don't push initial color to history? we want at least something? maybe add once
                // we add one dummy history item for better UX: push currentColor to history
                colorHistory.push({ ...currentColor });
                renderHistory();

                // randomize button
                randomizeBtn.addEventListener('click', () => {
                    const newCol = generateRandomColor();
                    setColor(newCol, true);
                });

                // copy HEX
                copyHexBtn.addEventListener('click', () => {
                    copyText(currentColor.hex, 'HEX');
                });

                // copy RGB (formatted as "rgb(r, g, b)" or just numbers? better as rgb(45,55,72) )
                copyRgbBtn.addEventListener('click', () => {
                    const rgbString = `rgb(${currentColor.r}, ${currentColor.g}, ${currentColor.b})`;
                    copyText(rgbString, 'RGB');
                });

                // clear history
                clearHistoryBtn.addEventListener('click', clearHistory);

                // optional: generate first random after 0.3s to make it lively? but we have fixed color. we can also set a random on load.
                // let's set a fresh random on page load to start with something fun
                setTimeout(() => {
                    const initialRandom = generateRandomColor();
                    setColor(initialRandom, true);
                }, 50);
            }

            init();
        })();
    </script>
</body>
</html>
